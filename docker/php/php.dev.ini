[PHP]
; 依頼BT-1(2026-09-11): docker/php/php.ini(zz-app.ini、全ステージ共通)で
; display_errors=Offにしたため、開発中の生エラー確認が画面上ではできなく
; なった。このファイルはbackend/Dockerfileのdevステージのみでconf.dへ
; コピーする(zz-app.iniよりアルファベット順で後に読ませて上書きする、
; docker/scripts/backend-entrypoint.render.shのzz-runtime-memory-limit.ini
; と同じ手口)。prod/renderステージのビルドにはこのファイルを一切含めない
; ため、本番には絶対に効かない(compose.override.yamlに頼るより確実 ――
; そちらはローカルのdocker compose実行時にのみ読まれる「運用上の」保証だが、
; こちらはビルドの時点でファイル自体が本番イメージに存在しない「構造上の」
; 保証になる)。
display_errors = On
