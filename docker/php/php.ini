[PHP]
memory_limit = 512M
; 依頼BR-1(2026-09-11): upload_max_filesizeがアプリ上限
; (config('analysis_attachment.max_file_size_bytes')、20MB、変更しない)と
; 同値だったため、20MBを超えるファイルはPHP自身が
; UploadedFile::isValid()=falseとして弾き、アプリ側の親切な日本語メッセージ
; (AnalysisAttachmentService::assertSizeWithinPerFileLimit())に一度も
; 到達できていなかった(依頼BJ改-4の実HTTP検証で発覚、英語の汎用メッセージ
; 「The file failed to upload.」が出ていた)。外側の関門(PHP)は、必ず
; 内側の上限(アプリ、20MB)より大きくすること ―― post_max_size(25M)を
; upload_max_filesize(20M)より大きくした依頼BI-4と同じ理由・同じ構図。
; 22MBにした根拠: アプリ上限(20MB)に対して、20MB台前半のファイルが
; PHP層で弾かれずアプリ層まで届く(=親切な日本語メッセージを出せる)ための
; 余裕として+2MB。post_max_size(25M)との間にも3MBの余裕を残す
; (multipartの境界文字列・他のフォーム項目・CSRFトークン分、依頼BI-4と
; 同じ考え方)。
;
; 上限の階層(この順序を崩さないこと):
;   client_max_body_size(25M, nginx) ≧ post_max_size(25M, PHP)
;     > upload_max_filesize(22M, PHP) > アプリ上限(20MB, config)
upload_max_filesize = 22M
; 依頼BI-4(2026-09-08): post_max_sizeはPOST全体(ファイル+他のフィールド+
; CSRFトークン+multipartの境界文字列)の上限であり、upload_max_filesizeと
; 同値だと20MB近いファイルを選んだ瞬間にPOST全体が上限を超える。その場合
; PHPはPOST本体を丸ごと破棄し($_POST/$_FILESが空になり、CSRFトークンも
; 消えるため)「ファイルが大きすぎます」ではなく419 Page Expiredが出て
; 原因不明になる(依頼BIの比較作成フォームは自社URL+競合URL5件+企業名5件も
; 同じPOSTに乗るため、詳細画面の添付欄より起きやすい)。upload_max_filesize
; (依頼BR-1で22MBへ変更)より確実に大きくするため、3MBの余裕を持たせる
; (post_max_sizeを超える経路自体は無くならない ―― その場合の日本語化は
; bootstrap/app.phpの419ハンドラ側で対処する、依頼BR-1参照)。
post_max_size = 25M
max_execution_time = 120
date.timezone = Asia/Tokyo
; 依頼BT-1(2026-09-11): display_errorsの指定が無く、PHPの既定値(On)が
; dev/prod/renderの全ステージに共通で効いていた。post_max_size超過時の
; SAPI起動時警告がレスポンス本体にそのまま漏れる不具合(依頼BSのrenderステージ
; 実HTTP検証で発覚)はこれが原因だったが、影響はアップロードに限らない ――
; 本番でPHPレベルの警告・注意・致命的エラーが起きた場合、絶対パス・関数名・
; 引数の一部・ライブラリの内部構造が、Laravelの起動有無に関わらず(APP_DEBUG=
; falseでも防げない)利用者のブラウザにそのまま出てしまう。このアプリは
; リードの会社名・担当者名・メールアドレスを扱うため、これらに関わる箇所で
; 警告が出れば画面に漏れる。消すのではなくログに残す(log_errors=On)。
; error_logは明示しない ―― php-fpmは既定でstderrに出し、Renderのログ収集は
; コンテナのstdout/stderrを読む構成(docker/nginx/render.conf.templateの
; access_log/error_logのコメント参照)のため、変える必要が無い。
;
; 開発時に画面へ戻す場合は、この値を直接変えずbackend/Dockerfileのdev
; ステージ専用の上書き(docker/php/php.dev.ini、zz-app.iniよりアルファベット
; 順で後に読まれる)を使う ―― compose.override.yaml側での対処はローカルの
; docker composeでのみ読まれる保証だが、Dockerfileのステージ分離であれば
; 本番(render/prodステージ)のビルドにそもそも含まれないため、より確実に
; 本番へ影響しない(依頼BR-4で確認したcompose.override.yamlの構造上の
; 保証よりさらに一段強い保証になる)。
display_errors = Off
log_errors = On
